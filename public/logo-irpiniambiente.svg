<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 140" width="100%" height="100%" style="background-color: #ffffff;">
  <!-- Irpiniambiente Logo - Vector reproduction maintaining exact proportions on pure white background -->
  <g id="irpiniambiente-logo" transform="translate(10, 15)">
    <!-- "Irpini" Text -->
    <text x="5" y="86" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="78" font-weight="400" fill="#2E3330" letter-spacing="-1px">Irpini</text>
    
    <!-- Tree Logo Mark acting as 'a' in 'ambiente' -->
    <g transform="translate(198, 8)">
      <!-- Main Green Circle -->
      <circle cx="48" cy="48" r="46" fill="#2BA835" />
      
      <!-- Tree Trunk at bottom -->
      <path d="M 46 84 L 46 102 L 49 102 L 49 84 Z" fill="#2BA835" />
      
      <!-- Slanted White Dashes (Canopy pattern) -->
      <!-- Row 1 (top) -->
      <line x1="49" y1="21" x2="43" y2="31" stroke="#ffffff" stroke-width="4.8" stroke-linecap="round" />
      
      <!-- Row 2 -->
      <line x1="43" y1="36" x2="37" y2="46" stroke="#ffffff" stroke-width="4.8" stroke-linecap="round" />
      <line x1="53" y1="36" x2="47" y2="46" stroke="#ffffff" stroke-width="4.8" stroke-linecap="round" />
      
      <!-- Row 3 -->
      <line x1="38" y1="51" x2="32" y2="61" stroke="#ffffff" stroke-width="4.8" stroke-linecap="round" />
      <line x1="48" y1="51" x2="42" y2="61" stroke="#ffffff" stroke-width="4.8" stroke-linecap="round" />
      <line x1="58" y1="51" x2="52" y2="61" stroke="#ffffff" stroke-width="4.8" stroke-linecap="round" />
      
      <!-- Row 4 (base of canopy) -->
      <line x1="33" y1="66" x2="27" y2="76" stroke="#ffffff" stroke-width="4.8" stroke-linecap="round" />
      <line x1="43" y1="66" x2="37" y2="76" stroke="#ffffff" stroke-width="4.8" stroke-linecap="round" />
      <line x1="53" y1="66" x2="47" y2="76" stroke="#ffffff" stroke-width="4.8" stroke-linecap="round" />
      <line x1="63" y1="66" x2="57" y2="76" stroke="#ffffff" stroke-width="4.8" stroke-linecap="round" />
    </g>
    
    <!-- "mbiente" Text -->
    <text x="306" y="86" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="78" font-weight="400" fill="#2E3330" letter-spacing="-1px">mbiente</text>
    
    <!-- "s.p.a." Text -->
    <text x="498" y="86" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="28" font-weight="400" fill="#4B514D" letter-spacing="0.5px">s.p.a.</text>
  </g>
</svg>
